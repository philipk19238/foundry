{% for request_ in help if request_.status in ("open", "claimed") %}
<div class="c-waiting">
  <span class="c-pulse" aria-hidden="true"></span>
  {% if request_.status == "open" %}
    <span>The agent is waiting on you. Reply below, or</span>
    <form method="post" action="/help/{{ request_.id }}/claim"><button class="c-link">take over the browser →</button></form>
  {% else %}
    <span>Someone is driving the browser.</span> <a href="/help/{{ request_.id }}">Open it →</a>
  {% endif %}
</div>
{% endfor %}
