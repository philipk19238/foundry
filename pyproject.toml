[project]
name = "portals"
version = "0.1.0"
description = "Every procurement portal Foundry scrapes: the scraper kit, shared platforms, and buyers"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.12", "scrapy==2.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portals"]
include = ["portals/**/*.py", "portals/**/*.json", "portals/**/*.toml", "portals/**/*.md"]

[tool.uv]
exclude-newer = "14 days"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
